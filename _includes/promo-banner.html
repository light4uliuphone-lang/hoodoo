{% comment %}
  活動橫幅（可重複使用）
  用法：{% include promo-banner.html %}
  建議放在 index.html 與 course-latest.html 的最上方（Hero 之前或之後）
  活動結束後，把引用這個 include 的那一行刪掉即可，不需改動其他內容
{% endcomment %}

<style>
  .promo-bar { display:block; text-decoration:none; background:linear-gradient(100deg,#1f1810 0%,#2f2317 55%,#1a1109 100%);
               border-bottom:1px solid rgba(201,151,63,.4); padding:.9rem 1.5rem; text-align:center;
               transition:filter .15s ease; }
  .promo-bar:hover { filter:brightness(1.15); }
  .promo-bar-in { max-width:1080px; margin:0 auto; display:flex; align-items:center; justify-content:center;
                  gap:.6rem 1.2rem; flex-wrap:wrap; }
  .promo-bar .tag { background:#8c3b2e; color:#fff; font-size:.72rem; font-weight:700; letter-spacing:.15em;
                    padding:.2rem .9rem; border-radius:999px; white-space:nowrap; }
  .promo-bar .msg { color:#f4ecdd; font-size:.98rem; letter-spacing:.03em; }
  .promo-bar .msg b { color:#c9973f; font-size:1.1rem; }
  .promo-bar .go { color:#c9973f; font-size:.9rem; font-weight:700; letter-spacing:.08em; white-space:nowrap; }
  @media (max-width:600px){
    .promo-bar { padding:.8rem 1rem; }
    .promo-bar .msg { font-size:.9rem; }
  }
</style>

<a class="promo-bar" href="/promo/2026h2/">
  <span class="promo-bar-in">
    <span class="tag">限 時 優 惠</span>
    <span class="msg">下半年度課程　一次報名三堂享 <b>85 折</b>　活動至 8/31 止</span>
    <span class="go">看優惠詳情 →</span>
  </span>
</a>
