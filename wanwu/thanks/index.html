<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>試閱本正在寄出｜靈火巫境</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0b0a;--ink-2:#171310;--gold:#c9973f;--gold-dim:#8a6a2c;
  --brick:#a83a28;--paper:#e8e2d6;--paper-dim:#9d968a;--line:rgba(201,151,63,.22);
  --line-green:#06c755;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);
  font-family:"Noto Sans TC",system-ui,sans-serif;font-weight:300;line-height:1.9;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:40px 24px;}
.card{max-width:560px;width:100%;text-align:center;position:relative}

/* 完成印記 */
.seal{width:96px;height:96px;margin:0 auto 34px;position:relative}
.seal svg{width:100%;height:100%;display:block}
.seal .ring{stroke:var(--gold);stroke-width:1.4;fill:none;opacity:.5}
.seal .check{stroke:var(--gold);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:40;stroke-dashoffset:40;animation:draw 1s ease .3s forwards;}
.seal .spin{transform-origin:50px 50px;animation:turn 24s linear infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes turn{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.seal .check{stroke-dashoffset:0;animation:none}.seal .spin{animation:none}}

.eyebrow{font-size:12px;letter-spacing:.28em;color:var(--gold-dim);text-transform:uppercase;margin:0 0 18px}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(28px,6vw,40px);
  line-height:1.4;margin:0 0 20px;letter-spacing:.04em;}
.lede{font-size:16px;color:var(--paper);max-width:30em;margin:0 auto 12px}
.hint{font-size:14px;color:var(--paper-dim);max-width:30em;margin:0 auto 40px}
.hint strong{color:var(--gold);font-weight:500}

.divider{height:1px;background:var(--line);border:0;margin:0 auto 40px;max-width:120px}

.line-block{background:var(--ink-2);border:1px solid var(--line);padding:32px 26px;margin:0 0 34px}
.line-block .k{font-size:11px;letter-spacing:.24em;color:var(--gold-dim);margin:0 0 10px}
.line-block h2{font-family:"Noto Serif TC",serif;font-weight:600;font-size:20px;margin:0 0 10px;color:var(--paper)}
.line-block p{font-size:14px;color:var(--paper-dim);margin:0 0 22px;max-width:26em;margin-left:auto;margin-right:auto}
.line-btn{display:inline-block;padding:14px 40px;background:var(--line-green);color:#fff;
  font-family:"Noto Serif TC",serif;font-size:16px;letter-spacing:.1em;text-decoration:none;
  transition:filter .2s ease;}
.line-btn:hover{filter:brightness(1.08)}

.pull{font-family:"Noto Serif TC",serif;font-size:18px;line-height:1.8;color:var(--paper-dim);margin:0 0 8px}
.pull span{color:var(--brick)}
.home{font-size:13px;color:var(--gold-dim)}
.home a{color:var(--gold-dim);text-decoration:none}
.home a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">

  <div class="seal">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <g class="spin"><circle class="ring" cx="50" cy="50" r="46"/></g>
      <circle class="ring" cx="50" cy="50" r="36" style="opacity:.28"/>
      <path class="check" d="M34 51 l11 11 l22 -24"/>
    </svg>
  </div>

  <p class="eyebrow">訂閱已確認</p>
  <h1>混沌之門已為你開啟</h1>
  <p class="lede">《萬物皆虛》試閱本正在寄往你的信箱。</p>
  <p class="hint">通常一兩分鐘內送達。如果沒看到，<strong>記得撈一下促銷分頁或垃圾信箱</strong>——把來信標成「非垃圾郵件」，之後的信才進得了主收件匣。</p>

  <hr class="divider">

  <div class="line-block">
    <p class="k">更 即 時 的 分 享</p>
    <h2>加入靈火巫境 LINE</h2>
    <p>擇時提醒、限定內容、開課第一手消息，都在 LINE 上先發。有問題也可以直接傳訊息給我。</p>
    <a class="line-btn" href="https://line.me/R/ti/p/@sorcery" target="_blank" rel="noopener">加入 LINE　@sorcery</a>
  </div>

  <p class="pull">「萬物皆虛，<span>萬事皆允</span>。」</p>
  <p class="home"><a href="https://hoodoo.pro">回到靈火巫境</a></p>

</div>
</body>
</html>
